<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito de Compras - Bombos y Tarola</title>
  <link rel="stylesheet" href="css/carrito_style.css">
</head>
<body>

  <div class="carrito">
    <h2>🛒 Tu carrito de Vinilos</h2>

    <div class="producto">
      <h4 class="vinilo">📀 Vinilo</h4>
      <div class="producto-info">
        <h4>Pink Floyd - The Wall</h4>
        <p>Precio: S/ <span class="precio">90</span></p>
      </div> 
      <input type="number" class="cantidad" value="1" min="1">
      <button class="eliminar">Eliminar</button>
    </div>

    <div class="producto">
      <h4 class="vinilo">📀 Vinilo</h4>
      <div class="producto-info">
        <h4>The Beatles - Abbey Road</h4>
        <p>Precio: S/ <span class="precio">120</span></p>
      </div>
      <input type="number" class="cantidad" value="2" min="1">
      <button class="eliminar">Eliminar</button>
    </div>

    <div class="total">
      <strong>Total: S/ <span id="total">0</span></strong><br><br>
      <button class="finalizar">Finalizar Compra</button>
    </div>
  </div>

  <script>
    function actualizarTotal() {
      let total = 0;
      const productos = document.querySelectorAll('.producto');
      productos.forEach(producto => {
        const precio = parseFloat(producto.querySelector('.precio').textContent);
        const cantidad = parseInt(producto.querySelector('.cantidad').value);
        total += precio * cantidad;
      });
      document.getElementById('total').textContent = total;
    }

    document.querySelectorAll('.cantidad').forEach(input => {
      input.addEventListener('change', actualizarTotal);
    });

    document.querySelectorAll('.eliminar').forEach(boton => {
      boton.addEventListener('click', function() {
        this.closest('.producto').remove();
        actualizarTotal();
      });
    });

    // Inicializar total al cargar
    actualizarTotal();
  </script>

</body>
</html>
